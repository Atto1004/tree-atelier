<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매물 상세 · Tree Atelier</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .detail-layout { display: grid; grid-template-columns: 1fr 358px; gap: var(--sp-6); align-items: start; }
  .buybox { position: sticky; top: calc(var(--header-h) + 16px); }
  .gallery { display: grid; grid-template-columns: 3fr 1fr; gap: 8px; }
  .gallery .main { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4/3; }
  .gallery .side { display: grid; grid-template-rows: repeat(3, 1fr); gap: 8px; }
  .gallery .side button {
    border-radius: var(--r); overflow: hidden; border: 1.5px solid var(--line);
    padding: 0; cursor: pointer; background: var(--bg-sunk); position: relative;
  }
  .gallery .side button[aria-current="true"] { border-color: var(--green-700); }
  .gallery .more {
    position: absolute; inset: 0; background: rgba(10,20,16,.55); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 15px;
  }
  @media (max-width: 940px) {
    .detail-layout { grid-template-columns: 1fr; }
    .buybox { position: static; }
    .gallery { grid-template-columns: 1fr; }
    .gallery .side { grid-template-rows: none; grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">›</span>
      <a href="listings.html">나무 찾기</a><span aria-hidden="true">›</span>
      <span id="bcSpecies">매물</span>
    </nav>

    <div class="detail-layout" id="detailRoot"></div>

    <!-- 유사 매물 -->
    <section class="section">
      <div class="section-head">
        <h2 class="h2">같은 수종의 다른 매물</h2>
        <a class="btn btn-secondary btn-sm" href="listings.html">전체 보기</a>
      </div>
      <div class="grid grid-auto" id="similar"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get('id');
const L = Store.Listings.get(id) || Store.Listings.all()[0];
const idx = PRICE_INDEX[L.species] || PRICE_INDEX.sonamu;

document.title = L.title + ' · Tree Atelier';
document.getElementById('bcSpecies').textContent = speciesName(L.species);

/* 개체 목록 — 이 매물에 속한 나무들의 고유 코드 */
const INDIV = individualsOf(L);

/* 등록 사진이 있으면 사진, 없으면 플레이스홀더 3종 */
const shots = (L.photoData && L.photoData.length)
  ? L.photoData.map((src, i) => `<img class="shot" src="${src}" alt="${esc(L.title)} 사진 ${i + 1}">`)
  : (farmThumbOf(L)
      ? [0, 1, 2].map(i => `<img class="shot" src="${FARM_THUMBS[(FARM_THUMBS.indexOf(farmThumbOf(L)) + i) % FARM_THUMBS.length]}" alt="${esc(L.title)} 현장 사진 ${i + 1}">`)
      : [
          thumbSVG(L),
          thumbSVG({ ...L, hue: L.hue + 14, id: L.id + 'b' }),
          thumbSVG({ ...L, hue: L.hue - 14, id: L.id + 'c' }),
        ]);
const extra = Math.max(0, (L.photos || shots.length) - 3);

/* 표준 규격에서 파생되는 값 */
const ballBase = L.spec.R || L.spec.B;
const ball = L.ball || rootBall(ballBase, L.species);
const tier = equipTier(ballBase);

/* 같은 규격대의 최근 실거래 (없으면 같은 수종 전체) */
const near = similarDeals(L.species, L.spec, 0.3);
const simDeals = near.length ? near : RECENT_DEALS.filter(d => d.species === L.species);

document.getElementById('detailRoot').innerHTML = `
<div>
  <!-- 갤러리 -->
  <div class="gallery mb5">
    <div class="main" id="galMain">${shots[0]}</div>
    <div class="side">
      ${shots.slice(0, 3).map((s, i) => `
        <button type="button" data-shot="${i}" aria-current="${i === 0}" aria-label="사진 ${i + 1} 보기">
          ${s}${i === 2 && extra ? `<span class="more">+${extra}</span>` : ''}
        </button>`).join('')}
    </div>
  </div>

  <!-- 타이틀 -->
  <div class="row g2 wrapf mb3">
    <span class="badge badge-gray">${speciesName(L.species)}</span>
    ${L.verified ? `<span class="badge badge-green">${ICON.shield} 인증농가</span>` : ''}
    ${L.dug ? '<span class="badge badge-wood">굴취완료</span>' : ''}
    <span class="badge ${L.status === '판매중' ? 'badge-success' : L.status === '협의중' ? 'badge-warn' : 'badge-gray'}">${L.status}</span>
  </div>
  <h1 class="h1">${esc(L.title)}</h1>
  <div class="row g3 wrapf mt3 small muted">
    <span>매물번호 ${L.id}</span><span aria-hidden="true">·</span>
    <span>등록 ${L.createdAt}</span><span aria-hidden="true">·</span>
    <span>조회 ${won(L.views)}</span><span aria-hidden="true">·</span>
    <span>관심 ${L.favs}</span>
  </div>

  <hr>

  <!-- 시세 참고 — 매물 가격(호가)은 공개하지 않고, 시장 시세만 보여줍니다 -->
  <section>
    <h2 class="h2 mb3">가격은 문의로, 시세는 공개로</h2>
    <div class="card card-pad">
      <div class="row between wrapf g3">
        <div>
          <div class="stat-k">이 매물 가격</div>
          <div class="stat-v price-ask" style="font-size:22px">가격 문의</div>
          <div class="stat-d muted">문의 시 시세 자료와 함께 안내</div>
        </div>
        <div>
          <div class="stat-k">${speciesName(L.species)} 평균 시세 (${idx.unit})</div>
          <div class="stat-v num">${won(idx.now)}원</div>
          <div class="stat-d muted num">거래 범위 ${wonShort(idx.low)} ~ ${wonShort(idx.high)}원</div>
        </div>
      </div>

      <div class="notice notice-green mt4"> <p><b>호가는 비공개, 체결가는 공개.</b>
           개별 매물의 부르는 값은 화면에 노출하지 않습니다. 대신 실제로 성사된 거래 가격을
           수종·규격별로 공개해서, 문의 전에 적정선을 알고 협의할 수 있게 합니다.
           <a class="accent strong" href="market.html">시세 근거 보기 →</a></p>
      </div>
    </div>

    <!-- 같은 규격이 실제로 얼마에 팔렸는지 -->
    <div class="mt5">
      <h3 class="h3 mb3">이 규격, 최근에 이 값에 팔렸습니다</h3>
      <div id="dealBanner" class="mb4"></div>
      <div class="card card-pad">${dealList(simDeals.slice(0, 5),
        `${speciesName(L.species)} ${L.notation || specNotation(L.species, L.spec)} 와 비슷한 규격의 최근 체결 건이 아직 없습니다.`)}</div>
    </div>
  </section>

  <hr>

  <!-- 규격 -->
  <section>
    <h2 class="h2 mb3">규격 및 조건</h2>

    <div class="card card-pad mb4" style="background:var(--bg-soft)">
      <div class="grid grid-3 g4">
        <div>
          <div class="stat-k">표준 규격 표기</div>
          <div class="stat-v num" style="font-size:21px">${L.notation || specNotation(L.species, L.spec) || '—'}</div>
          <div class="stat-d muted">${(SPEC_RULES[L.species] || SPEC_RULES.etc).group}</div>
        </div>
        ${ball ? `
        <div>
          <div class="stat-k">뿌리분 크기 (추정)</div>
          <div class="stat-v num" style="font-size:21px">Ø${ball.dia}cm</div>
          <div class="stat-d muted num">깊이 약 ${ball.depth}cm</div>
        </div>` : ''}
        ${tier ? `
        <div>
          <div class="stat-k">필요 장비 (참고)</div>
          <div class="stat-v" style="font-size:15px;line-height:1.4">${tier.gear}</div>
          <div class="stat-d muted">굴취 ${tier.dig}</div>
        </div>` : ''}
      </div>
      <p class="hint mt3">
        뿌리분·장비는 근원직경 기준 관용식으로 계산한 참고값입니다.
        실제 시공 기준은 조경공사 표준시방서와 현장 여건(진입로·토질)에 따라 달라집니다.
        <a class="accent strong" href="guide.html">규격 표기가 무슨 뜻인지 보기 →</a>
      </p>
    </div>

    <div class="table-scroll">
      <table class="table spec-table">
        <caption class="sr-only">매물 규격 상세</caption>
        <tbody>
          <tr><th scope="row">수종</th><td>${speciesName(L.species)}</td></tr>
          <tr><th scope="row">근원직경 (R)</th><td>${L.spec.R ? L.spec.R + ' cm' : '해당 없음'}<span class="tiny muted"> · 지표면에 닿는 줄기</span></td></tr>
          <tr><th scope="row">흉고직경 (B)</th><td>${L.spec.B ? L.spec.B + ' cm' : '해당 없음'}<span class="tiny muted"> · 지표면 1.2m 높이</span></td></tr>
          <tr><th scope="row">수고 (H)</th><td>${L.spec.H ? L.spec.H + ' m' : '해당 없음'}</td></tr>
          <tr><th scope="row">수관폭 (W)</th><td>${L.spec.W ? L.spec.W + ' m' : '해당 없음'}</td></tr>
          <tr><th scope="row">수량</th><td class="num">${won(L.qty)}주</td></tr>
          <tr><th scope="row">재배 기간</th><td>${L.years}년</td></tr>
          <tr><th scope="row">굴취 여부</th><td>${L.dug ? '굴취 완료 · 즉시 상차 가능' : '미실시 · 굴취 별도 진행'}</td></tr>
          <tr><th scope="row">이식 적기</th><td>${L.season}</td></tr>
          <tr><th scope="row">소재지</th><td>${L.addr}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="row g2 wrapf mt4">
      ${L.tags.map(t => `<span class="badge badge-gray">#${t}</span>`).join('')}
    </div>
  </section>

  <hr>

  <!-- 개체 코드 — 핵심 기능 -->
  <section>
    <h2 class="h2 mb2">개체 코드
      <span class="num muted" style="font-size:16px">${INDIV.length}주${L.qty > INDIV.length ? ` / 전체 ${won(L.qty)}주` : ''}</span>
    </h2>
    <p class="lead mb4">
      이 매물의 나무는 한 그루마다 고유 코드가 있습니다.
      코드를 누르면 <b class="accent">그 나무의 사진과 실측 규격</b>을 볼 수 있습니다.
    </p>

    ${L.qty > INDIV.length ? `
    <div class="notice notice-info mb4">
      <span aria-hidden="true">ℹ️</span>
      <p>전체 ${won(L.qty)}주 중 대표 <b>${INDIV.length}주</b>가
         ${INDIV[0] && INDIV[0].measured ? '실측 등록되어' : '코드 발급되어'} 있습니다.
         나머지는 동일 규격군이며, 거래 확정 시 전 주에 코드가 발급됩니다.</p>
    </div>` : ''}

    <div class="table-scroll">
      <table class="table indiv-table">
        <caption class="sr-only">개체별 코드와 실측 규격</caption>
        <thead>
          <tr>
            <th scope="col">코드</th>
            <th scope="col">사진</th>
            <th scope="col">실측 규격</th>
            <th scope="col">수형</th>
            <th scope="col">상태</th>
          </tr>
        </thead>
        <tbody>
          ${INDIV.map(t => {
            const thumb = (L.photoData && L.photoData.length)
              ? `<img src="${L.photoData[(t.idx - 1) % L.photoData.length]}" alt="">`
              : (farmThumbOf(L) ? `<img src="${FARM_THUMBS[(t.idx - 1) % FARM_THUMBS.length]}" alt="">` : thumbSVG({ id: t.code, species: t.species, hue: t.hue, dug: L.dug }));
            const st = t.status === '판매중' ? 'badge-success' : t.status === '예약중' ? 'badge-warn' : 'badge-gray';
            return `<tr>
              <th scope="row"><a class="tree-code" href="tree.html?code=${t.code}">${t.code}</a></th>
              <td><span class="indiv-thumb">${thumb}</span></td>
              <td class="num strong">${t.notation || '—'}</td>
              <td>${t.grade ? `<span class="grade grade-${t.grade}">${t.grade}</span>` : '<span class="tiny muted">실측 전</span>'}</td>
              <td><span class="badge ${st}">${t.status}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="hint mt3">코드는 견적서·계약서에 그대로 적어 쓰실 수 있습니다. 어떤 나무를 받는지 서로 분명해집니다.</p>
  </section>

  <hr>

  <!-- 설명 -->
  <section>
    <h2 class="h2 mb3">재배자 설명</h2>
    <p class="lead" style="white-space:pre-wrap">${esc(L.desc) || '<span class="muted">등록된 설명이 없습니다.</span>'}</p>
  </section>

  <hr>

  <!-- 굴취·운반 -->
  <section>
    <h2 class="h2 mb2">굴취·운반은 어떻게 하나요?</h2>
    <p class="lead mb4">현장 인근 등록 업체의 견적을 한 번에 받아 비교할 수 있습니다.</p>
    <div class="grid grid-3">
      ${MOVERS.map(m => `
        <div class="card card-pad stack g3">
          <div class="row g3">
            <span class="avatar" aria-hidden="true">${m.init}</span>
            <div class="grow">
              <div class="strong">${m.name}</div>
              <div class="tiny muted">${m.region} · ★ ${m.rating}</div>
            </div>
          </div>
          <p class="small muted">${m.spec}</p>
          <div class="row between">
            <span class="small strong">${m.price}</span>
            <span class="badge badge-green">${m.badge}</span>
          </div>
        </div>`).join('')}
    </div>
    <a class="btn btn-secondary btn-block mt4" href="movers.html">3개 업체에 견적 한 번에 요청하기</a>
  </section>

  <hr>

  <!-- 재배자 -->
  <section>
    <h2 class="h2 mb3">재배자 정보</h2>
    <div class="card card-pad">
      <div class="row g4 wrapf">
        <span class="avatar avatar-lg" aria-hidden="true">${L.growerInit}</span>
        <div class="grow">
          <div class="row g2 wrapf">
            <span class="h3">${L.grower}</span>
            ${L.verified ? `<span class="badge badge-green">${ICON.shield} 신원·농지 인증</span>` : '<span class="badge badge-gray">미인증</span>'}
          </div>
          <p class="small muted mt1">${L.region} · 재배 경력 ${L.years}년</p>
        </div>
        <a class="btn btn-secondary" href="farm.html">농장 소개 · 지도</a>
      </div>
      <div class="grid grid-3 mt4">
        <div><div class="stat-k">거래 성사</div><div class="strong num">${L.deals}건</div></div>
        <div><div class="stat-k">평균 평점</div><div class="strong num">★ ${L.rating}</div></div>
        <div><div class="stat-k">응답률</div><div class="strong num">98%</div></div>
      </div>
    </div>
  </section>
</div>

<!-- ========== 우측 문의 박스 — 가격은 노출하지 않습니다 ========== -->
<aside class="buybox">
  <div class="card card-pad stack g4">
    <div>
      <div class="stat-k">가격</div>
      <div class="stat-v price-ask" style="font-size:24px">가격 문의</div>
      <p class="hint mt1">문의하면 판매자가 직접 회신합니다. 회신 가격에는 시세 대비 위치가 함께 표시됩니다.</p>
    </div>

    <div class="divider"></div>

    <dl class="stack g2 small">
      <div class="row between"><dt class="muted">규격</dt><dd class="num strong">${L.notation || specNotation(L.species, L.spec)}</dd></div>
      <div class="row between"><dt class="muted">수량</dt><dd class="num strong">${won(L.qty)}주</dd></div>
      <div class="row between"><dt class="muted">개체 코드</dt><dd class="num strong">${INDIV.length}주 발급</dd></div>
      <div class="row between"><dt class="muted">${speciesName(L.species)} 시세</dt><dd class="num">${won(idx.now)}원 <span class="tiny muted">(${idx.unit})</span></dd></div>
      <div class="row between"><dt class="muted">굴취·운반</dt><dd>별도 견적</dd></div>
    </dl>

    <button class="btn btn-primary btn-lg btn-block" type="button" id="offerBtn">구매 문의하기</button>
    <button class="btn btn-secondary btn-block" type="button" id="priceBtn">가격 제안하기</button>
    <button class="btn btn-ghost btn-block" type="button" id="favBtn" aria-pressed="false">♡ 관심 매물 저장</button>

    <p class="hint center">
      대금은 인수 확인 전까지 플랫폼이 보관합니다.<br>문제가 있으면 전액 환불됩니다.
    </p>
  </div>

  <div class="notice notice-warn mt4"> <p><b>시세보다 크게 낮은 제안은 자동으로 표시됩니다.</b>
       평균 대비 20% 이상 낮은 제안에는 경고가 붙고, 판매자에게 사유를 함께 전달합니다.</p>
  </div>
</aside>`;

/* 같은 규격 최근 실거래 배너 */
dealTicker(document.getElementById('dealBanner'), simDeals, { soft: true, max: 6 });

/* 유사 매물 */
const all = Store.Listings.all();
const sim = all.filter(x => x.species === L.species && x.id !== L.id);
const pool = sim.length ? sim : all.filter(x => x.id !== L.id).slice(0, 4);
document.getElementById('similar').innerHTML = pool.slice(0, 4).map(listingCard).join('');

/* 프로토타입 동작 안내 */
document.getElementById('offerBtn').addEventListener('click', () => { location.href = 'inquiry.html?lot=' + encodeURIComponent(L.id); });
document.getElementById('priceBtn').addEventListener('click', () =>
  alert('프로토타입입니다.\n\n가격 제안 시 시세 대비 몇 % 인지가 양쪽 모두에게 표시됩니다.'));
/* 관심 매물 — 저장소에 남습니다 */
const favBtn = document.getElementById('favBtn');
function syncFav(on) {
  favBtn.setAttribute('aria-pressed', String(on));
  favBtn.textContent = on ? '♥ 관심 매물에 저장됨' : '♡ 관심 매물 저장';
}
syncFav(Store.Favs.has(L.id));
favBtn.addEventListener('click', () => syncFav(Store.Favs.toggle(L.id)));

/* 갤러리 썸네일 선택 */
document.querySelectorAll('[data-shot]').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-shot]').forEach(x => x.setAttribute('aria-current', 'false'));
    b.setAttribute('aria-current', 'true');
    document.getElementById('galMain').innerHTML = shots[Number(b.dataset.shot)];
  });
});

/* 내가 등록한 매물이면 삭제 버튼 */
if (L.mine) {
  document.querySelector('.buybox .card').insertAdjacentHTML('beforeend',
    '<button class="btn btn-ghost btn-block" type="button" id="delBtn" style="color:var(--danger)">이 매물 삭제</button>');
  document.getElementById('delBtn').addEventListener('click', () => {
    if (!confirm('이 매물을 삭제할까요? 되돌릴 수 없습니다.')) return;
    Store.Listings.remove(L.id);
    location.href = 'listings.html';
  });
}
</script>
</body>
</html>
