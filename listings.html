<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나무 목록 · 법원리농원</title>
<meta name="description" content="법원리농원 적송 전체 목록. 근원직경·수형·구역으로 골라 관리번호를 담고 한꺼번에 문의합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .filters { display: grid; grid-template-columns: auto auto minmax(220px, 300px) auto; gap: 18px 32px; align-items: end;
    padding: 22px 0; border-bottom: 1px solid var(--line); }
  .f-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .f-label { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; color: var(--ink-3); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips .chip { min-height: 36px; padding: 0 13px; font-size: 14px; }
  .f-sort .select { min-height: 40px; min-width: 150px; }
  @media (max-width: 1040px) { .filters { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px)  { .filters { grid-template-columns: 1fr; gap: 16px; } }

  .result-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
  .result-bar b { font-family: var(--serif); font-size: 20px; font-weight: 600; }

  /* 목록 — 표처럼 정렬된 줄 */
  .tlist { border-top: 1px solid var(--green-800); }
  .trow { display: grid; grid-template-columns: 44px 120px 90px 120px 110px minmax(0, 1fr) 96px; align-items: center; gap: 12px;
    padding: 14px 4px; border-bottom: 1px solid var(--line); transition: background-color .15s var(--ease); }
  .trow:hover { background: #fff; }
  .trow.head { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; color: var(--ink-3); padding-block: 12px; }
  .trow.head:hover { background: none; }
  .trow .r { font-family: var(--serif); font-size: 19px; font-weight: 600; white-space: nowrap; }
  .trow .b, .trow .form { font-size: 14.5px; color: var(--ink-2); white-space: nowrap; }
  .trow .place { font-size: 13.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .go { justify-self: end; font-size: 14px; font-weight: 600; color: var(--green-700); white-space: nowrap; }
  .trow .go:hover { text-decoration: underline; }
  .pick { width: 22px; height: 22px; accent-color: var(--green-800); cursor: pointer; }
  @media (max-width: 860px) {
    .trow { grid-template-columns: 36px 1fr auto; grid-template-areas: "pick code r" "pick meta go"; gap: 4px 12px; padding: 14px 2px; }
    .trow.head { display: none; }
    .trow .c-pick { grid-area: pick; } .trow .c-code { grid-area: code; } .trow .r { grid-area: r; justify-self: end; }
    .trow .b, .trow .place { display: none; }
    .trow .form { grid-area: meta; font-size: 13.5px; color: var(--ink-3); }
    .trow .go { grid-area: go; }
  }

  .more-row { display: flex; justify-content: center; padding: 28px 0 8px; }

  /* 담은 나무 바 */
  .pickbar { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 160%); z-index: 95;
    display: flex; align-items: center; gap: 16px; padding: 10px 10px 10px 22px; border-radius: 999px;
    background: var(--green-900); color: #fff; box-shadow: var(--sh-3); transition: transform .28s var(--ease); white-space: nowrap; }
  .pickbar { visibility: hidden; }
  .pickbar.on { transform: translate(-50%, 0); visibility: visible; }
  .pickbar b { font-weight: 700; }
  .pickbar .btn-ghost { color: rgba(255,255,255,.75); min-height: 40px; }
  .pickbar .btn-ghost:hover { background: rgba(255,255,255,.08); color: #fff; }
  .pickbar .btn-primary { background: #fff; color: var(--green-900); min-height: 42px; border-radius: 999px; }
  .pickbar .btn-primary:hover { background: var(--green-50); }
  @media (max-width: 760px) { .pickbar { bottom: 76px; gap: 8px; padding-left: 18px; } }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <header class="page-head" style="margin-bottom:0">
      <span class="eyebrow">나무 목록</span>
      <h1 class="h1" id="pageTitle">법원리농원 적송</h1>
      <p class="lead">마음에 드는 나무를 담아 두었다가 한꺼번에 문의하세요. 가격은 문의하시면 알려드립니다.</p>
    </header>

    <div class="filters">
      <div class="f-group">
        <span class="f-label">수형</span>
        <div class="chips" id="fForm" role="group" aria-label="수형"></div>
      </div>
      <div class="f-group">
        <span class="f-label">구역</span>
        <div class="chips" id="fZone" role="group" aria-label="구역"></div>
      </div>
      <div class="f-group" id="fR"></div>
      <div class="f-group f-sort">
        <label class="f-label" for="fSort">정렬</label>
        <select class="select" id="fSort">
          <option value="code">관리번호 순</option>
          <option value="rdesc">굵은 나무부터</option>
          <option value="rasc">가는 나무부터</option>
        </select>
      </div>
    </div>

    <div class="result-bar">
      <span><b class="num" id="count">0</b><span class="muted"> 그루</span></span>
      <button class="btn btn-ghost btn-sm" type="button" id="resetBtn">조건 지우기</button>
    </div>

    <div class="tlist" id="tlist" role="list"></div>
    <div class="more-row"><button class="btn btn-secondary" type="button" id="moreBtn" hidden>더 보기</button></div>
  </div>
</main>

<div class="pickbar" id="pickbar" aria-live="polite">
  <span><b id="pickN">0</b>그루 담음</span>
  <button class="btn btn-ghost btn-sm" type="button" id="pickClear">비우기</button>
  <a class="btn btn-primary btn-sm" id="pickGo" href="inquiry.html">담은 나무 문의</a>
</div>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/farm-map.js"></script>
<script src="assets/js/farm-photos.js"></script>
<script src="assets/js/app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const ST = registryStats();
const PAGE = 40;
const zq = (qs.get('zone') || '').toUpperCase();
const S = {
  form: qs.get('form') || 'all',
  zone: /^[A-D]$/.test(zq) ? zq : 'all',
  rmin: qs.get('rmin') ? +qs.get('rmin') : null,
  rmax: qs.get('rmax') ? +qs.get('rmax') : null,
  sort: qs.get('sort') || 'code',
  shown: PAGE,
};

document.getElementById('pageTitle').textContent = `법원리농원 적송 ${ST.count}주`;

/* ---------- 필터 ---------- */
const FORMS = [['all', '전체'], ['single', '단간'], ['multi', '다간'], ['bansong', '반송']];
const ZONES = [['all', '전체'], ...['A', 'B', 'C', 'D'].map(z => [z, z + ' 구역'])];
function chips(el, list, key) {
  el.innerHTML = list.map(([v, l]) => `<button class="chip" type="button" data-v="${v}" aria-pressed="${S[key] === v}">${l}</button>`).join('');
  el.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    S[key] = c.dataset.v; S.shown = PAGE;
    $$('.chip', el).forEach(x => x.setAttribute('aria-pressed', String(x === c)));
    render();
  });
}
chips($('#fForm'), FORMS, 'form');
chips($('#fZone'), ZONES, 'zone');
const rs = rangeSlider($('#fR'), {
  label: '근원직경 R', min: ST.rMin, max: ST.rMax, unit: 'cm', fmt: v => 'R' + v,
  lo: S.rmin, hi: S.rmax,
  onChange: ({ lo, hi }) => { S.rmin = lo; S.rmax = hi; S.shown = PAGE; render(); },
});
$('#fSort').value = S.sort;
$('#fSort').addEventListener('change', e => { S.sort = e.target.value; render(); });
$('#resetBtn').addEventListener('click', () => {
  S.form = 'all'; S.zone = 'all'; S.rmin = S.rmax = null; S.sort = 'code'; S.shown = PAGE;
  $$('#fForm .chip, #fZone .chip').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === 'all')));
  rs.reset(true); $('#fSort').value = 'code';
  render();
});

/* ---------- 거르기 · 정렬 ---------- */
const zoneOrder = { A: 0, B: 1, C: 2, D: 3 };
const lineNum = l => (l === 'H' ? -1 : +l);
function filtered() {
  const list = FARM_TREES.filter(t => {
    if (S.form === 'single' && (t.multi || t.note === '반송')) return false;
    if (S.form === 'multi' && !t.multi) return false;
    if (S.form === 'bansong' && t.note !== '반송') return false;
    if (S.zone !== 'all' && t.zone !== S.zone) return false;
    if (S.rmin != null && !(t.r >= S.rmin)) return false;
    if (S.rmax != null && !(t.r <= S.rmax)) return false;
    return true;
  });
  const byCode = (a, b) => zoneOrder[a.zone] - zoneOrder[b.zone] || lineNum(a.line) - lineNum(b.line) || a.seq - b.seq;
  if (S.sort === 'rdesc') list.sort((a, b) => (b.r || 0) - (a.r || 0) || byCode(a, b));
  else if (S.sort === 'rasc') list.sort((a, b) => (a.r || 999) - (b.r || 999) || byCode(a, b));
  else list.sort(byCode);
  return list;
}

/* ---------- 그리기 ---------- */
function row(t) {
  const on = Picks.has(t.code);
  return `<div class="trow" role="listitem">
    <span class="c-pick"><input class="pick" type="checkbox" data-code="${t.code}" ${on ? 'checked' : ''} aria-label="${t.code} 담기"></span>
    <span class="c-code"><a class="tree-code" href="tree.html?code=${t.code}">${t.code}</a></span>
    <span class="r num">${t.r != null ? 'R' + t.r : '—'}</span>
    <span class="b num">${t.b != null ? 'B' + t.b : (t.stems ? 'B ' + t.stems.join('+') : '—')}</span>
    <span class="form">${treeForm(t)}</span>
    <span class="place">${farmPlaceText(t.code)}</span>
    <a class="go" href="tree.html?code=${t.code}">자세히</a>
  </div>`;
}
function render() {
  const list = filtered();
  $('#count').textContent = list.length;
  $('#tlist').innerHTML = list.length
    ? `<div class="trow head" aria-hidden="true"><span>담기</span><span>관리번호</span><span>근원직경</span><span>흉고직경</span><span>수형</span><span>자리</span><span></span></div>`
      + list.slice(0, S.shown).map(row).join('')
    : `<div class="empty" style="padding:48px 0"><p class="strong">조건에 맞는 나무가 없습니다.</p><p class="small muted mt2">범위를 넓히거나 조건을 지워 보세요.</p></div>`;
  $('#moreBtn').hidden = list.length <= S.shown;
  $('#moreBtn').textContent = `더 보기 (${list.length - S.shown}그루 남음)`;
  const p = new URLSearchParams();
  if (S.form !== 'all') p.set('form', S.form);
  if (S.zone !== 'all') p.set('zone', S.zone);
  if (S.rmin != null) p.set('rmin', S.rmin);
  if (S.rmax != null) p.set('rmax', S.rmax);
  if (S.sort !== 'code') p.set('sort', S.sort);
  history.replaceState(null, '', 'listings.html' + (p.toString() ? '?' + p : ''));
}
$('#moreBtn').addEventListener('click', () => { S.shown += PAGE; render(); });

/* ---------- 담기 ---------- */
function syncPicks() {
  const list = Picks.all();
  $('#pickN').textContent = list.length;
  $('#pickbar').classList.toggle('on', list.length > 0);
  $('#pickGo').href = 'inquiry.html' + (list.length ? '?codes=' + list.join(',') : '');
}
$('#tlist').addEventListener('change', e => {
  const c = e.target.closest('.pick'); if (!c) return;
  Picks.toggle(c.dataset.code); syncPicks();
});
$('#pickClear').addEventListener('click', () => {
  Picks.clear(); $$('.pick').forEach(x => { x.checked = false; }); syncPicks();
});

render();
syncPicks();
</script>
</body>
</html>
