<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개체 조회 · 법원리농원</title>
<meta name="description" content="개체 코드로 나무 한 그루의 사진과 실측 규격을 조회합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .tree-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); align-items: start; }
  .tree-photo { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4/3; background: var(--bg-sunk); }
  .tree-photo img, .tree-photo svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 860px) { .tree-layout { grid-template-columns: 1fr; } }
  .lookup { padding: var(--sp-6) 0; border-bottom: 1px solid var(--line); }
  .spec-big { display: flex; align-items: baseline; gap: 14px; padding: 18px 0; border-top: 1px solid var(--green-800); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .spec-big b { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; white-space: nowrap; }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">›</span>
      <a href="listings.html">나무 목록</a><span aria-hidden="true">›</span>
      <span>관리번호 조회</span>
    </nav>

    <!-- 코드 조회 -->
    <section class="lookup mb6">
      <h1 class="h2 mb2">관리번호로 찾기</h1>
      <p class="small muted mb4">
        농원의 나무에는 한 그루마다 관리번호표가 달려 있습니다. 번호를 넣으면 그 나무의 실측 규격과 자리가 나옵니다.
      </p>
      <form class="code-lookup" id="lookupForm">
        <div class="field grow" style="max-width:300px">
          <label class="sr-only" for="codeInput">개체 코드</label>
          <input class="input" id="codeInput" type="text" placeholder="예: A-3-6"
                 autocomplete="off" spellcheck="false" maxlength="12">
        </div>
        <button class="btn btn-primary" type="submit">조회</button>
      </form>
      <p class="hint mt2">구역-줄-번호 순서입니다. 예: A-3-6</p>
    </section>

    <div id="treeRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/farm-map.js"></script>
<script src="assets/js/farm-photos.js"></script>
<script src="assets/js/app.js"></script>
<script>
const q = new URLSearchParams(location.search).get('code') || '';
document.getElementById('codeInput').value = q.toUpperCase();

document.getElementById('lookupForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('codeInput').value.trim();
  if (v) location.href = 'tree.html?code=' + encodeURIComponent(v.toUpperCase());
});

const RT = q ? registryByCode(q) : null;          /* 법원리농원 관리번호 */
const root = document.getElementById('treeRoot');

if (RT) {
  renderRegistryTree(RT);
} else if (!q) {
  root.innerHTML = `
    <div class="empty">
      <p class="strong">관리번호를 넣어 주세요.</p>
      <p class="small mt2 mb4">예시 번호를 눌러 바로 볼 수 있습니다.</p>
      <div class="row g2 wrapf" style="justify-content:center">
        ${['A-H-1', 'B-1-1', 'C-3-9', 'D-5-3'].map(c => `<a class="tree-code" href="tree.html?code=${c}">${c}</a>`).join('')}
      </div>
      <a class="btn btn-secondary mt4" href="listings.html">목록에서 고르기</a>
    </div>`;
} else {
  root.innerHTML = `
    <div class="empty">
      <p class="strong">'${esc(q)}' 번호의 나무를 찾을 수 없습니다.</p>
      <p class="small mt2">구역-줄-번호 순서(예: A-3-6)인지 확인해 주세요.</p>
      <a class="btn btn-secondary mt4" href="listings.html">목록에서 고르기</a>
    </div>`;
}
/* ---------- 법원리농원 관리번호 개체 ---------- */
function renderRegistryTree(T) {
  document.title = T.code + ' · 법원리농원';
  const hero = heroOf(T.code), photos = treePhotosOf(T.code), tags = photosOf(T.code).filter(p => p.kind === 'tag');
  const stems = T.stems ? T.stems.join(' + ') : null;
  const ball = T.r ? rootBall(T.r, T.note === '반송' ? 'bansong' : 'sonamu') : null;
  const tier = T.r ? equipTier(T.r) : null;
  const zoneTrees = registryZone(T.zone).filter(x => x.line === T.line && x.code !== T.code);
  root.innerHTML = `
  <div class="tree-layout">
    <div>
      <div class="tree-photo mb3" style="position:relative">
        <img src="${hero.src}" alt="${T.code} ${hero.sample ? '참고 사진' : '실사진'}">
        <span class="photo-tag">${heroLabel(hero)}</span>
      </div>
      ${photos.length > 1 || tags.length ? `<div class="thumbs mb3">${[...photos, ...tags].map(p => `<img src="${p.file}" alt="${p.kind === 'tag' ? '관리표' : '사진'}" data-src="${p.file}">`).join('')}</div>` : ''}
      <p class="hint">${hero.sample ? '농원 현장 사진입니다. 이 나무의 사진은 문의하시면 보내드립니다.' : '관리표와 함께 찍은 현장 사진입니다.'}</p>
    </div>

    <div class="stack g4">
      <div>
        <div class="row g2 wrapf mb3">
          <span class="badge badge-gray">${T.note === '반송' ? '반송' : '적송'}</span>
          ${T.multi ? `<span class="badge badge-green">다간 ${T.stems.length}간</span>` : '<span class="badge badge-gray">단간</span>'}
          ${tags.length ? '<span class="badge badge-green">관리표 확인</span>' : ''}
          <span class="badge badge-gray">2026.09 실측</span>
        </div>
        <span class="tree-code tree-code-lg">${T.code}</span>
        <button class="btn btn-ghost btn-sm mt2" type="button" id="copyBtn">번호 복사</button>
        <p class="small muted mt2">${FARM.name} · ${farmPlaceText(T.code)}</p>
      </div>

      <div class="spec-big">
        <span class="muted small">근원직경</span>
        <b class="num">R${T.r != null ? T.r : '—'}</b>
        ${T.b != null ? `<span class="muted">흉고 B${T.b}</span>` : ''}
      </div>

      <div class="table-scroll">
        <table class="table spec-table">
          <caption class="sr-only">개체 장부 규격</caption>
          <tbody>
            <tr><th scope="row">근원직경 (R)</th><td class="num">${T.r != null ? T.r + ' cm' : '—'}</td></tr>
            <tr><th scope="row">흉고직경 (B)</th><td class="num">${T.b != null ? T.b + ' cm' : (stems ? '환산 전 (줄기별 기록)' : '—')}</td></tr>
            ${stems ? `<tr><th scope="row">줄기별 흉고</th><td class="num">${stems} cm</td></tr>` : ''}
            <tr><th scope="row">약제 처리량</th><td class="num">${T.dose != null ? T.dose : '—'}</td></tr>
            ${T.note && T.note !== '반송' ? `<tr><th scope="row">비고</th><td>${esc(T.note)}</td></tr>` : ''}
            ${ball ? `<tr><th scope="row">뿌리분 (추정)</th><td class="num">Ø${ball.dia}cm · 깊이 약 ${ball.depth}cm</td></tr>` : ''}
            ${tier ? `<tr><th scope="row">필요 장비 (참고)</th><td>${tier.gear}</td></tr>` : ''}
            <tr><th scope="row">소재지</th><td>${esc(FARM.addr)}</td></tr>
          </tbody>
        </table>
      </div>

      <div class="grid grid-2" style="gap:10px">
        <a class="btn btn-primary btn-lg" href="inquiry.html?code=${T.code}">이 나무 문의</a>
        <button class="btn btn-secondary btn-lg" type="button" id="pickBtn"></button>
      </div>
      <a class="btn btn-ghost btn-block" href="farm.html#${T.code}">배치도에서 이 자리 보기</a>
      <p class="hint center">가격은 문의하시면 알려드립니다.</p>
    </div>
  </div>

  <hr>

  <section>
    <h2 class="h2 mb4">같은 줄의 다른 나무 (${T.zone === 'A' && T.line !== 'H' ? T.line + '열' : T.line + '줄'})</h2>
    <div class="row g2 wrapf">
      ${zoneTrees.map(x => `<a class="tree-code" href="tree.html?code=${x.code}">${x.code}</a>`).join('') || '<span class="small muted">없음</span>'}
    </div>
  </section>`;

  root.querySelectorAll('.thumbs img').forEach(im => im.addEventListener('click', () => {
    const main = root.querySelector('.tree-photo img'); main.src = im.dataset.src;
  }));
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(T.code); toast('관리번호를 복사했습니다: ' + T.code, 'ok'); }
    catch (e) { toast('복사하지 못했습니다. 관리번호: ' + T.code); }
  });
  const pickBtn = document.getElementById('pickBtn');
  const paintPick = () => { pickBtn.textContent = Picks.has(T.code) ? '담았습니다' : '문의 목록에 담기'; };
  pickBtn.addEventListener('click', () => {
    const on = Picks.toggle(T.code); paintPick();
    toast(on ? `${T.code}를 담았습니다. 담은 나무 ${Picks.all().length}그루` : `${T.code}를 뺐습니다.`, on ? 'ok' : undefined);
  });
  paintPick();
}
</script>
</body>
</html>
