<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개체 조회 · Tree Atelier</title>
<meta name="description" content="개체 코드로 나무 한 그루의 사진과 실측 규격을 조회합니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .tree-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-6); align-items: start; }
  .tree-photo { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4/3; background: var(--bg-sunk); }
  .tree-photo img, .tree-photo svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 860px) { .tree-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">›</span>
      <a href="listings.html">나무 찾기</a><span aria-hidden="true">›</span>
      <span>개체 조회</span>
    </nav>

    <!-- 코드 조회 -->
    <section class="card card-pad mb6">
      <h1 class="h2 mb2">개체 코드 조회</h1>
      <p class="small muted mb4">
        나무 한 그루마다 고유 코드가 있습니다. 코드만 있으면 누구나 그 나무의 실측 정보를 볼 수 있습니다.
      </p>
      <form class="code-lookup" id="lookupForm">
        <div class="field grow" style="max-width:300px">
          <label class="sr-only" for="codeInput">개체 코드</label>
          <input class="input" id="codeInput" type="text" placeholder="예: A-H-1 또는 SN0142-03"
                 autocomplete="off" spellcheck="false" maxlength="12">
        </div>
        <button class="btn btn-primary" type="submit">조회</button>
      </form>
      <p class="hint mt2">법원리농원 관리번호(구역-줄-번호, 예: A-3-6) 또는 매물 개체 코드(수종 2자 + 매물번호 4자리 - 개체번호)를 입력하세요.</p>
    </section>

    <div id="treeRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/farm-map.js"></script>
<script src="assets/js/farm-photos.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
const q = new URLSearchParams(location.search).get('code') || '';
document.getElementById('codeInput').value = q.toUpperCase();

document.getElementById('lookupForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('codeInput').value.trim();
  if (v) location.href = 'tree.html?code=' + encodeURIComponent(v.toUpperCase());
});

const RT = q ? registryByCode(q) : null;          /* 법원리농원 관리번호 */
const T = q && !RT ? treeByCode(q, Store.Listings.all()) : null;
const root = document.getElementById('treeRoot');

if (RT) {
  renderRegistryTree(RT);
} else if (!q) {
  /* 코드 없이 들어온 경우 — 예시 코드 안내 */
  const ex = individualsOf(LISTINGS[0]).slice(0, 3);
  root.innerHTML = `
    <div class="empty">
      <p class="strong">조회할 개체 코드를 입력해 주세요.</p>
      <p class="small mt2 mb4">예시 코드를 눌러 바로 확인해 볼 수 있습니다.</p>
      <div class="row g2 wrapf" style="justify-content:center">
        ${['A-H-1', 'B-1-1', 'C-3-9', 'D-5-3'].map(c => `<a class="tree-code" href="tree.html?code=${c}">${c}</a>`).join('')}
        ${ex.map(t => `<a class="tree-code" href="tree.html?code=${t.code}">${t.code}</a>`).join('')}
      </div>
      <a class="btn btn-secondary mt4" href="farm.html">배치도에서 고르기</a>
    </div>`;
} else if (!T) {
  root.innerHTML = `
    <div class="empty">
      <p class="strong">'${esc(q)}' 코드를 찾을 수 없습니다.</p>
      <p class="small mt2">코드를 다시 확인하시거나, 거래가 끝나 내려간 매물일 수 있습니다.</p>
      <a class="btn btn-secondary mt4" href="listings.html">매물 둘러보기</a>
    </div>`;
} else {
  const L = Store.Listings.get(T.listingId);
  const rule = SPEC_RULES[T.species] || SPEC_RULES.etc;
  const ball = rootBall(T.spec.R || T.spec.B, T.species);
  const tier = equipTier(T.spec.R || T.spec.B);
  document.title = T.code + ' · 개체 조회 · Tree Atelier';

  /* 사진 — 매물 사진이 있으면 개체 번호에 맞춰 배정, 없으면 개체별 플레이스홀더 */
  const photo = (L.photoData && L.photoData.length)
    ? `<img src="${L.photoData[(T.idx - 1) % L.photoData.length]}" alt="${T.code} 개체 사진">`
    : thumbSVG({ id: T.code, species: T.species, hue: T.hue, dug: L.dug });

  const statusBadge = T.status === '판매중' ? 'badge-success'
                    : T.status === '예약중' ? 'badge-warn' : 'badge-gray';

  root.innerHTML = `
  <div class="tree-layout">

    <div>
      <div class="tree-photo mb3">${photo}</div>
      <p class="hint">
        ${L.photoData && L.photoData.length
          ? '재배자가 등록한 현장 사진입니다.'
          : '아직 개체 사진이 등록되지 않아 대체 이미지가 표시됩니다.'}
      </p>
    </div>

    <div class="stack g4">
      <div>
        <div class="row g2 wrapf mb3">
          <span class="badge badge-gray">${speciesName(T.species)}</span>
          <span class="badge ${statusBadge}">${T.status}</span>
          ${T.grade ? `<span class="badge badge-green">수형 ${T.grade}등급</span>` : ''}
          ${T.measured
            ? `<span class="badge badge-info">실측 ${T.measuredAt}</span>`
            : '<span class="badge badge-gray">실측 전 · 매물 규격 기준</span>'}
        </div>
        <span class="tree-code tree-code-lg">${T.code}</span>
        <button class="btn btn-ghost btn-sm mt2" type="button" id="copyBtn">코드 복사</button>
      </div>

      <div class="card card-pad" style="background:var(--bg-soft)">
        <div class="stat-k">표준 규격 표기</div>
        <div class="stat-v num" style="font-size:26px">${T.notation || '—'}</div>
        <div class="stat-d muted">${rule.group}</div>
      </div>

      <div class="table-scroll">
        <table class="table spec-table">
          <caption class="sr-only">개체 실측 규격</caption>
          <tbody>
            <tr><th scope="row">수고 (H)</th><td class="num">${T.spec.H != null ? T.spec.H + ' m' : '—'}</td></tr>
            <tr><th scope="row">수관폭 (W)</th><td class="num">${T.spec.W != null ? T.spec.W + ' m' : '—'}</td></tr>
            <tr><th scope="row">흉고직경 (B)</th><td class="num">${T.spec.B != null ? T.spec.B + ' cm' : '—'}</td></tr>
            <tr><th scope="row">근원직경 (R)</th><td class="num">${T.spec.R != null ? T.spec.R + ' cm' : '—'}</td></tr>
            ${ball ? `<tr><th scope="row">뿌리분 (추정)</th><td class="num">Ø${ball.dia}cm · 깊이 약 ${ball.depth}cm</td></tr>` : ''}
            ${tier ? `<tr><th scope="row">필요 장비 (참고)</th><td>${tier.gear}</td></tr>` : ''}
            <tr><th scope="row">소재지</th><td>${esc(L.addr || L.region)}</td></tr>
            <tr><th scope="row">이식 적기</th><td>${esc(L.season)}</td></tr>
          </tbody>
        </table>
      </div>

      <a class="btn btn-primary btn-lg btn-block" href="inquiry.html?code=${T.code}">이 개체 구매 문의</a>
      <p class="hint center">가격은 화면에 공개하지 않습니다. 문의하시면 시세 자료와 함께 안내드립니다.</p>
    </div>
  </div>

  <hr>

  <!-- 소속 매물 -->
  <section class="mb6">
    <div class="section-head">
      <div>
        <h2 class="h2">이 나무가 속한 매물</h2>
        <p class="small muted mt1">${esc(L.grower)} · ${won(L.qty)}주 중 ${T.idx}번 개체</p>
      </div>
      <a class="btn btn-secondary btn-sm" href="detail.html?id=${encodeURIComponent(L.id)}">매물 전체 보기</a>
    </div>
    <div class="grid grid-auto">${listingCard(L)}</div>
  </section>

  <!-- 같은 매물의 다른 개체 -->
  <section>
    <h2 class="h2 mb4">같은 매물의 다른 개체</h2>
    <div class="row g2 wrapf">
      ${individualsOf(L).filter(x => x.code !== T.code).slice(0, 9)
        .map(x => `<a class="tree-code" href="tree.html?code=${x.code}">${x.code}</a>`).join('')}
    </div>
  </section>`;

  document.getElementById('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(T.code);
      toast('코드를 복사했습니다: ' + T.code, 'ok');
    } catch (e) {
      toast('복사하지 못했습니다. 코드: ' + T.code);
    }
  });
}
/* ---------- 법원리농원 관리번호 개체 ---------- */
function renderRegistryTree(T) {
  document.title = T.code + ' · 개체 조회 · Tree Atelier';
  const hero = heroOf(T.code), photos = treePhotosOf(T.code), tags = photosOf(T.code).filter(p => p.kind === 'tag');
  const stems = T.stems ? T.stems.join(' + ') : null;
  const ball = T.r ? rootBall(T.r, T.note === '반송' ? 'bansong' : 'sonamu') : null;
  const tier = T.r ? equipTier(T.r) : null;
  const zoneTrees = registryZone(T.zone).filter(x => x.line === T.line && x.code !== T.code);
  root.innerHTML = `
  <div class="tree-layout">
    <div>
      <div class="tree-photo mb3" style="position:relative">
        <img src="${hero.src}" alt="${T.code} ${hero.sample ? '참고 사진' : '실사진'}">
        <span class="photo-tag">${heroLabel(hero)}</span>
      </div>
      ${photos.length > 1 || tags.length ? `<div class="thumbs mb3">${[...photos, ...tags].map(p => `<img src="${p.file}" alt="${p.kind === 'tag' ? '관리표' : '사진'}" data-src="${p.file}">`).join('')}</div>` : ''}
      <p class="hint">${hero.sample ? '법원리농원 현장 참고 사진입니다. 개체 사진은 구매 문의 시 보내드립니다.' : '관리표와 함께 촬영된 현장 사진입니다.'}</p>
    </div>

    <div class="stack g4">
      <div>
        <div class="row g2 wrapf mb3">
          <span class="badge badge-gray">${T.note === '반송' ? '반송' : '적송'}</span>
          ${T.multi ? `<span class="badge badge-green">다간 ${T.stems.length}간</span>` : '<span class="badge badge-gray">단간</span>'}
          ${tags.length ? '<span class="badge badge-green">관리표 확인</span>' : ''}
          <span class="badge badge-info">2026.09 장부 기준</span>
        </div>
        <span class="tree-code tree-code-lg">${T.code}</span>
        <button class="btn btn-ghost btn-sm mt2" type="button" id="copyBtn">코드 복사</button>
        <p class="small muted mt2">${FARM.name} · ${farmPlaceText(T.code)}</p>
      </div>

      <div class="card card-pad" style="background:var(--bg-soft)">
        <div class="stat-k">규격 (근원직경 기준)</div>
        <div class="stat-v num" style="font-size:26px">R${T.r != null ? T.r : '—'}${T.b != null ? ` · B${T.b}` : ''}</div>
        <div class="stat-d muted">농원 장부 실측값</div>
      </div>

      <div class="table-scroll">
        <table class="table spec-table">
          <caption class="sr-only">개체 장부 규격</caption>
          <tbody>
            <tr><th scope="row">근원직경 (R)</th><td class="num">${T.r != null ? T.r + ' cm' : '—'}</td></tr>
            <tr><th scope="row">흉고직경 (B)</th><td class="num">${T.b != null ? T.b + ' cm' : (stems ? '환산 전 (줄기별 기록)' : '—')}</td></tr>
            ${stems ? `<tr><th scope="row">줄기별 흉고</th><td class="num">${stems} cm</td></tr>` : ''}
            <tr><th scope="row">약제 처리량</th><td class="num">${T.dose != null ? T.dose : '—'}</td></tr>
            ${T.note && T.note !== '반송' ? `<tr><th scope="row">비고</th><td>${esc(T.note)}</td></tr>` : ''}
            ${ball ? `<tr><th scope="row">뿌리분 (추정)</th><td class="num">Ø${ball.dia}cm · 깊이 약 ${ball.depth}cm</td></tr>` : ''}
            ${tier ? `<tr><th scope="row">필요 장비 (참고)</th><td>${tier.gear}</td></tr>` : ''}
            <tr><th scope="row">소재지</th><td>${esc(FARM.addr)}</td></tr>
          </tbody>
        </table>
      </div>

      <a class="btn btn-secondary btn-block" href="farm.html#${T.code}">배치도에서 이 자리 보기</a>
      <a class="btn btn-primary btn-lg btn-block" href="inquiry.html?code=${T.code}">이 개체 구매 문의</a>
      <p class="hint center">가격은 화면에 공개하지 않습니다. 문의하시면 시세 자료와 함께 안내드립니다.</p>
    </div>
  </div>

  <hr>

  <section>
    <h2 class="h2 mb4">같은 줄의 다른 나무 (${T.zone === 'A' && T.line !== 'H' ? T.line + '열' : T.line + '줄'})</h2>
    <div class="row g2 wrapf">
      ${zoneTrees.map(x => `<a class="tree-code" href="tree.html?code=${x.code}">${x.code}</a>`).join('') || '<span class="small muted">없음</span>'}
    </div>
  </section>`;

  root.querySelectorAll('.thumbs img').forEach(im => im.addEventListener('click', () => {
    const main = root.querySelector('.tree-photo img'); main.src = im.dataset.src;
  }));
  document.getElementById('copyBtn').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(T.code); toast('코드를 복사했습니다: ' + T.code, 'ok'); }
    catch (e) { toast('복사하지 못했습니다. 코드: ' + T.code); }
  });
}
</script>
</body>
</html>
