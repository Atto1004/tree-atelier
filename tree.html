<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나무 보기 · 법원리농원</title>
<meta name="description" content="번호표로 법원리농원 소나무 한 그루의 크기·모양·자리를 볼 수 있어요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .tree-layout { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(24px, 4vw, 56px); align-items: start; padding-top: 24px; }
  @media (max-width: 860px) { .tree-layout { grid-template-columns: 1fr; } }
  .tree-photo { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4/3; background: var(--bg-sunk); }
  .tree-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-tag { position: absolute; left: 14px; bottom: 14px; padding: 6px 10px; border-radius: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 600; }
  .thumbs { display: flex; gap: 8px; margin-top: 10px; }
  .thumbs img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; cursor: pointer; }
  .photo-note { font-size: 14px; color: var(--ink-3); margin-top: 10px; }

  .t-code { font-size: 15px; font-weight: 600; color: var(--ink-3); }
  .t-title { font-size: clamp(28px, 3.6vw, 36px); font-weight: 700; letter-spacing: -.03em; line-height: 1.3; margin-top: 4px; }
  .t-sub { font-size: 16px; color: var(--ink-3); margin-top: 6px; }

  .facts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 24px; }
  .facts3 > div { padding: 16px; border-radius: 16px; background: var(--bg-soft); min-width: 0; }
  .facts3 span { display: block; font-size: 13.5px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .facts3 b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; white-space: nowrap; }

  .scale { margin-top: 24px; }
  .scale-h { font-size: 15px; font-weight: 700; }
  .scale-bar { position: relative; height: 10px; border-radius: 5px; background: var(--bg-soft); margin: 14px 0 8px; }
  .scale-bar i { position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: var(--green-700); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); transform: translate(-50%, -50%); }
  .scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-4); }

  .notes { display: grid; gap: 10px; margin-top: 24px; }
  .notes p { font-size: 15.5px; line-height: 1.65; color: var(--ink-2); padding-left: 14px; border-left: 3px solid var(--green-200); }

  .cta2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 28px; }
  .more-spec { margin-top: 16px; }
  .more-spec summary { cursor: pointer; font-size: 14.5px; font-weight: 600; color: var(--ink-3); padding: 10px 0; }
  .more-spec table { width: 100%; font-size: 14.5px; }
  .more-spec th, .more-spec td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
  .more-spec th { color: var(--ink-3); font-weight: 600; width: 46%; }

  .near { margin-top: 56px; }
  .near .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  .lookup { display: flex; gap: 8px; max-width: 420px; margin-top: 16px; }
  .lookup .input { flex: 1; }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <div id="treeRoot"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/farm-map.js"></script>
<script src="assets/js/farm-photos.js"></script>
<script src="assets/js/app.js"></script>
<script>
const q = (new URLSearchParams(location.search).get('code') || '').trim();
const T = q ? registryByCode(q) : null;
const root = document.getElementById('treeRoot');
const ST = registryStats();

function lookupForm(msg, sub) {
  return `
  <header class="page-head">
    <h1 class="h1">${msg}</h1>
    <p class="lead">${sub}</p>
    <form class="lookup" id="lookupForm">
      <label class="sr-only" for="codeInput">번호표</label>
      <input class="input" id="codeInput" type="text" placeholder="예: A-3-6" autocomplete="off" spellcheck="false" maxlength="10" value="${esc(q.toUpperCase())}">
      <button class="btn btn-primary" type="submit">찾기</button>
    </form>
    <div class="row g2 wrapf mt4">
      <span class="small muted">예시</span>
      ${['A-H-1', 'B-1-1', 'C-3-9', 'D-5-3'].map(c => `<a class="tree-code" href="tree.html?code=${c}">${c}</a>`).join('')}
    </div>
  </header>`;
}

if (!T) {
  root.innerHTML = q
    ? lookupForm(`'${esc(q)}' 나무를 못 찾았어요`, '번호표는 구역-줄-번호 순서예요. 예: A-3-6')
    : lookupForm('번호표로 찾기', '농원 나무마다 번호표가 달려 있어요. 번호를 넣으면 그 나무를 보여드려요.');
  document.getElementById('lookupForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('codeInput').value.trim();
    if (v) location.href = 'tree.html?code=' + encodeURIComponent(v.toUpperCase());
  });
} else {
  renderTree(T);
}

function renderTree(T) {
  document.title = T.code + ' · 법원리농원';
  const hero = heroOf(T.code), photos = treePhotosOf(T.code), tags = photosOf(T.code).filter(p => p.kind === 'tag');
  const size = sizeOf(T.r);
  const pct = T.r != null ? Math.round(((T.r - ST.rMin) / (ST.rMax - ST.rMin)) * 100) : 50;
  const bigger = FARM_TREES.filter(x => x.r > T.r).length;
  const ball = T.r ? rootBall(T.r, T.note === '반송' ? 'bansong' : 'sonamu') : null;
  const near = registryZone(T.zone).filter(x => x.line === T.line && x.code !== T.code);
  const formNote = T.note === '반송'
    ? '낮고 둥글게 퍼지는 소나무예요. 정원 가운데나 입구에 많이 심어요.'
    : T.multi ? `밑에서 줄기가 ${T.stems.length}개로 갈라졌어요. 한 그루로도 풍성해 보여요.`
    : '줄기가 하나로 곧게 올라간 나무예요.';
  const moveNote = T.r > 20
    ? '이 정도 굵기는 옮길 때 크레인이 필요해요. 현장 위치를 알려 주시면 방법을 같이 정해요.'
    : '옮기는 방법과 일정은 현장 위치를 보고 같이 정해요.';

  root.innerHTML = `
  <nav class="breadcrumb mt4" aria-label="현재 위치">
    <a href="index.html">홈</a><span aria-hidden="true">›</span>
    <a href="listings.html">나무 고르기</a><span aria-hidden="true">›</span><span>${T.code}</span>
  </nav>
  <div class="tree-layout">
    <div>
      <div class="tree-photo">
        <img src="${hero.src}" alt="${T.code} 소나무 ${hero.sample ? '농원 사진' : '사진'}">
        <span class="photo-tag">${hero.sample ? '농원 사진' : '이 나무 사진'}</span>
      </div>
      ${photos.length > 1 || tags.length ? `<div class="thumbs">${[...photos, ...tags].map(p => `<img src="${p.file}" alt="${p.kind === 'tag' ? '번호표' : '사진'}" data-src="${p.file}">`).join('')}</div>` : ''}
      <p class="photo-note">${hero.sample ? '이 나무 사진은 문의하면 보내드려요.' : '번호표와 함께 찍은 사진이에요.'}</p>
    </div>

    <div>
      <p class="t-code">번호표 ${T.code}</p>
      <h1 class="t-title">${size ? size.label + ' ' : ''}${T.note === '반송' ? '반송' : '소나무'}</h1>
      <p class="t-sub">${treeForm(T)} · ${farmPlaceText(T.code)}</p>

      <div class="facts3">
        <div><span>밑동 굵기</span><b class="num">${T.r != null ? T.r + 'cm' : '—'}</b></div>
        <div><span>모양</span><b>${treeForm(T)}</b></div>
        <div><span>구역</span><b>${T.zone} 구역</b></div>
      </div>

      <div class="scale">
        <p class="scale-h">농원 ${ST.count}그루 중 굵기로 상위 ${Math.max(1, Math.round((bigger + 1) / ST.count * 100))}%예요</p>
        <div class="scale-bar"><i style="left:${pct}%"></i></div>
        <div class="scale-ends"><span>가장 작은 나무 ${ST.rMin}cm</span><span>가장 큰 나무 ${ST.rMax}cm</span></div>
      </div>

      <div class="notes">
        <p>${formNote}</p>
        <p>${moveNote}</p>
      </div>

      <div class="cta2">
        <a class="btn btn-primary btn-lg" href="inquiry.html?code=${T.code}">가격 물어보기</a>
        <button class="btn btn-secondary btn-lg" type="button" id="pickBtn"></button>
      </div>

      <details class="more-spec">
        <summary>자세한 규격 보기</summary>
        <table><tbody>
          <tr><th>근원직경 R (밑동 지름)</th><td class="num">${T.r != null ? T.r + ' cm' : '—'}</td></tr>
          <tr><th>흉고직경 B (가슴 높이 지름)</th><td class="num">${T.b != null ? T.b + ' cm' : (T.stems ? T.stems.join(' + ') + ' cm (줄기별)' : '—')}</td></tr>
          ${ball ? `<tr><th>뿌리 흙덩이 (추정)</th><td class="num">지름 약 ${ball.dia}cm</td></tr>` : ''}
          <tr><th>잰 날</th><td>2026년 9월</td></tr>
          <tr><th>농원 위치</th><td>${esc(FARM.addr)}</td></tr>
        </tbody></table>
      </details>
      <a class="btn btn-ghost btn-block mt2" href="farm.html#${T.code}">농원 지도에서 자리 보기</a>
    </div>
  </div>

  ${near.length ? `<section class="near">
    <h2 class="h3">바로 옆 줄 나무</h2>
    <div class="chips">${near.map(x => `<a class="tree-code" href="tree.html?code=${x.code}">${x.code} · ${x.r}cm</a>`).join('')}</div>
  </section>` : ''}`;

  root.querySelectorAll('.thumbs img').forEach(im => im.addEventListener('click', () => {
    root.querySelector('.tree-photo img').src = im.dataset.src;
  }));
  const pickBtn = document.getElementById('pickBtn');
  const paint = () => { pickBtn.textContent = Picks.has(T.code) ? '담았어요' : '담기'; };
  pickBtn.addEventListener('click', () => {
    const on = Picks.toggle(T.code); paint();
    toast(on ? `담았어요. 지금 ${Picks.all().length}그루` : '뺐어요', on ? 'ok' : undefined);
  });
  paint();
}
</script>
</body>
</html>
