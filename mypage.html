<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이페이지 · Tree Atelier</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .my-layout { display: grid; grid-template-columns: 240px 1fr; gap: var(--sp-6); align-items: start; }
  .my-nav { position: sticky; top: calc(var(--header-h) + 16px); display: flex; flex-direction: column; gap: 2px; }
  .my-nav button {
    text-align: left; padding: 12px 14px; border: 0; background: none; border-radius: var(--r);
    font-size: 15px; font-weight: 600; color: var(--ink-2); cursor: pointer;
  }
  .my-nav button:hover { background: var(--bg-sunk); }
  .my-nav button[aria-current="true"] { background: var(--green-100); color: var(--green-700); font-weight: 700; }
  @media (max-width: 900px) {
    .my-layout { grid-template-columns: 1fr; }
    .my-nav { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
    .my-nav button { white-space: nowrap; border: 1.5px solid var(--line); }
  }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">›</span><span>마이페이지</span>
    </nav>

    <!-- 프로필 -->
    <header class="card card-pad mb5">
      <div class="row g4 wrapf">
        <span class="avatar avatar-lg" aria-hidden="true" id="meInit">김</span>
        <div class="grow">
          <div class="row g2 wrapf">
            <h1 class="h2" id="meName">법원리농원 김OO</h1>
            <span class="badge badge-green">신원·농지 인증</span>
            <span class="badge badge-gray">재배자</span>
          </div>
          <p class="small muted mt1">경북 봉화군 · 재배 경력 14년 · 가입 2025년 3월</p>
        </div>
        <a class="btn btn-secondary" href="#">프로필 수정</a>
      </div>

      <div class="grid grid-4 mt5">
        <div class="stat"><div class="stat-k">등록 매물</div><div class="stat-v num" id="statListings">0</div><div class="stat-d muted" id="statListingsSub">판매중</div></div>
        <div class="stat"><div class="stat-k">누적 거래</div><div class="stat-v num">38건</div><div class="stat-d muted">최근 6개월 11건</div></div>
        <div class="stat"><div class="stat-k">누적 정산액</div><div class="stat-v num">1.2억</div><div class="stat-d muted">수수료 차감 후</div></div>
        <div class="stat"><div class="stat-k">평균 평점</div><div class="stat-v num">★ 4.9</div><div class="stat-d muted">응답률 98%</div></div>
      </div>
    </header>

    <div class="my-layout">

      <nav class="my-nav card card-pad" aria-label="마이페이지 메뉴" id="myNav" style="padding:8px">
        <button type="button" data-p="dash" aria-current="true">대시보드</button>
        <button type="button" data-p="mine">내 매물</button>
        <button type="button" data-p="posts">내가 쓴 글</button>
        <button type="button" data-p="offer">받은 문의</button>
        <button type="button" data-p="fav">♥ 관심 매물</button>
        <button type="button" data-p="settle">정산 내역</button>
        <button type="button" data-p="alarm">알림 설정</button>
      </nav>

      <div id="myPanel"></div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* 내가 등록한 매물 + 시드 데이터의 같은 농가 매물 */
const mine = Store.Listings.mine().concat(LISTINGS.filter(l => l.grower.startsWith('법원리')));
const idx = PRICE_INDEX.sonamu;

const PANELS = {
  dash: () => `
    <section class="stack g5">
      <div class="notice notice-green"> <p><b>소나무 시세가 이번 달 8.8% 올랐습니다.</b>
           지금 R15 기준 주당 ${won(idx.now)}원입니다.
           등록해 두신 매물 단가는 ${won(mine[0].unitPrice)}원 — 시세보다 낮습니다.
           <a class="accent strong" href="#">단가 조정하기 →</a></p>
      </div>

      <div class="card card-pad">
        <h2 class="h2 mb3">내 수종 시세 추이</h2>
        <p class="small muted mb3">소나무 · R15 기준 · 최근 6개월</p>
        ${barsHTML(idx.history, PRICE_MONTHS)}
        <a class="btn btn-secondary btn-sm mt4" href="market.html">전체 시세 보기</a>
      </div>

      <div class="card card-pad">
        <h2 class="h2 mb4">최근 활동</h2>
        <ul class="stack g4">
          <li class="row g3" style="align-items:flex-start">
            <span class="badge badge-success">문의</span>
            <div class="grow"><b>대성조경(주)</b>가 <a class="accent" href="detail.html?id=L2409-0142">적송 R15 120주</a>에 문의했습니다.
              <p class="tiny muted mt1">2시간 전 · 아직 답장하지 않았습니다</p></div>
          </li>
          <li class="row g3" style="align-items:flex-start">
            <span class="badge badge-warn">제안</span>
            <div class="grow">주당 <b class="num">195,000원</b> 제안이 들어왔습니다.
              <span class="fair fair-low">시세 대비 32% 낮음</span>
              <p class="tiny muted mt1">1일 전 · 자동 경고가 붙어 전달되었습니다</p></div>
          </li>
          <li class="row g3" style="align-items:flex-start">
            <span class="badge badge-info">정산</span>
            <div class="grow">반송 H1.5 36주 거래 대금 <b class="num">13,455,000원</b>이 입금되었습니다.
              <p class="tiny muted mt1">3일 전 · 수수료 415,800원 차감 후</p></div>
          </li>
          <li class="row g3" style="align-items:flex-start">
            <span class="badge badge-gray">조회</span>
            <div class="grow">이번 주 내 매물이 <b class="num">318회</b> 조회되었습니다. 지난주 대비 24% 증가.
              <p class="tiny muted mt1">5일 전</p></div>
          </li>
        </ul>
      </div>
    </section>`,

  mine: () => `
    <section>
      <div class="section-head">
        <h2 class="h2">내 매물 <span class="num muted">${mine.length}</span></h2>
        <a class="btn btn-primary btn-sm" href="sell.html">+ 농원에 나무 추가</a>
      </div>
      ${mine.length
        ? `<div class="grid grid-auto">${mine.map(listingCard).join('')}</div>
           <div class="notice mt5"> <p>사진이 5장 미만인 매물은 문의가 절반 수준입니다. 사진을 더 올려 보세요.</p>
           </div>`
        : `<div class="empty">
             <p class="strong">아직 등록한 매물이 없습니다.</p>
             <p class="small mt2">수종과 규격만 넣으면 지금 시세를 바로 확인할 수 있습니다.</p>
             <a class="btn btn-primary mt4" href="sell.html">농원 등록하기</a>
           </div>`}
    </section>`,

  posts: () => {
    const my = Store.Posts.mine();
    return `
    <section>
      <div class="section-head">
        <h2 class="h2">내가 쓴 글 <span class="num muted">${my.length}</span></h2>
        <a class="btn btn-primary btn-sm" href="community-write.html">글쓰기</a>
      </div>
      <div class="card card-pad">
        <ul>${my.length ? my.map(p => `
          <li class="post">
            <span class="avatar" aria-hidden="true">${p.init}</span>
            <div class="post-body">
              <div class="row g2 wrapf mb1"><span class="badge badge-gray">${p.cat}</span></div>
              <a class="post-title" href="post.html?id=${encodeURIComponent(p.id)}">${p.title}</a>
              <p class="post-excerpt">${p.excerpt}</p>
              <div class="post-meta">
                <span>${p.date}</span><span>조회 ${won(p.views || 0)}</span>
                <span>${Store.Comments.countFor(p)}</span>
              </div>
            </div>
          </li>`).join('') : `
          <li class="empty">
            <p class="strong">아직 쓴 글이 없습니다.</p>
            <p class="small mt2">키우면서 알게 된 것을 남겨 보세요.</p>
            <a class="btn btn-primary mt4" href="community-write.html">글쓰기</a>
          </li>`}</ul>
      </div>
    </section>`;
  },

  offer: () => `
    <section class="stack g4">
      <h2 class="h2">받은 문의</h2>
      ${[
        { who: '대성조경(주)', init: '대', item: '적송 R15 120주', price: 268000, when: '2시간 전', kind: 'ask' },
        { who: '한빛건설', init: '한', item: '적송 R15 120주', price: 195000, when: '1일 전', kind: 'low' },
        { who: '푸른숲조경', init: '푸', item: '반송 H1.5 36주', price: 380000, when: '4일 전', kind: 'ok' },
      ].map(o => {
        const f = o.price / idx.now;
        const tag = o.kind === 'low'
          ? `<span class="fair fair-low">시세 대비 ${Math.round((1 - f) * 100)}% 낮음</span>`
          : o.kind === 'ok' ? '<span class="fair fair-mid">적정 제안</span>' : '<span class="badge badge-info">문의</span>';
        return `<div class="card card-pad">
          <div class="row g3 wrapf">
            <span class="avatar" aria-hidden="true">${o.init}</span>
            <div class="grow">
              <div class="row g2 wrapf"><b>${o.who}</b>${tag}</div>
              <p class="small muted mt1">${o.item} · 제안 단가 <b class="num">${won(o.price)}원</b> · ${o.when}</p>
            </div>
            <div class="row g2">
              <button class="btn btn-secondary btn-sm" type="button">거절</button>
              <button class="btn btn-primary btn-sm" type="button">답장</button>
            </div>
          </div>
          ${o.kind === 'low' ? `<div class="notice notice-warn mt3"> <p>시세보다 크게 낮은 제안입니다. 급하게 처분할 상황이 아니라면 재고해 보세요.
               같은 규격 최근 체결가는 ${won(idx.low)}~${won(idx.high)}원입니다.</p></div>` : ''}
        </div>`;
      }).join('')}
    </section>`,

  fav: () => {
    const ids = Store.Favs.all();
    const rows = Store.Listings.all().filter(l => ids.indexOf(l.id) !== -1);
    return `
    <section>
      <h2 class="h2 mb4">관심 매물 <span class="num muted">${rows.length}</span></h2>
      ${rows.length
        ? `<div class="grid grid-auto">${rows.map(listingCard).join('')}</div>`
        : `<div class="empty">
             <p class="strong">저장한 매물이 없습니다.</p>
             <p class="small mt2">매물 카드의 하트를 누르면 여기에 모입니다.</p>
             <a class="btn btn-primary mt4" href="listings.html">나무 찾아보기</a>
           </div>`}
    </section>`;
  },

  settle: () => `
    <section>
      <h2 class="h2 mb4">정산 내역</h2>
      <div class="grid grid-3 mb5">
        <div class="stat"><div class="stat-k">정산 완료</div><div class="stat-v num">1.2억</div></div>
        <div class="stat"><div class="stat-k">정산 예정</div><div class="stat-v num">1,345만</div><div class="stat-d muted">2026-09-03 입금</div></div>
        <div class="stat"><div class="stat-k">누적 수수료</div><div class="stat-v num">372만</div><div class="stat-d muted">거래액의 3%</div></div>
      </div>
      <div class="table-scroll">
        <table class="table">
          <caption class="sr-only">정산 내역</caption>
          <thead><tr>
            <th scope="col">일자</th><th scope="col">매물</th>
            <th scope="col" class="ta-r">거래액</th><th scope="col" class="ta-r">수수료</th>
            <th scope="col" class="ta-r">정산액</th><th scope="col">상태</th>
          </tr></thead>
          <tbody>
            <tr><td class="num">2026-08-29</td><td>반송 H1.5 36주</td><td class="ta-r num">13,860,000</td><td class="ta-r num">415,800</td><td class="ta-r num strong">13,444,200</td><td><span class="badge badge-success">입금완료</span></td></tr>
            <tr><td class="num">2026-07-14</td><td>적송 R12 80주</td><td class="ta-r num">18,400,000</td><td class="ta-r num">552,000</td><td class="ta-r num strong">17,848,000</td><td><span class="badge badge-success">입금완료</span></td></tr>
            <tr><td class="num">2026-06-02</td><td>반송 H2.0 12주</td><td class="ta-r num">7,680,000</td><td class="ta-r num">230,400</td><td class="ta-r num strong">7,449,600</td><td><span class="badge badge-success">입금완료</span></td></tr>
            <tr><td class="num">2026-09-03</td><td>적송 R15 20주 (예정)</td><td class="ta-r num">5,360,000</td><td class="ta-r num">160,800</td><td class="ta-r num strong">5,199,200</td><td><span class="badge badge-warn">정산예정</span></td></tr>
          </tbody>
        </table>
      </div>
    </section>`,

  alarm: () => `
    <section class="stack g5">
      <h2 class="h2">알림 설정</h2>
      <div class="card card-pad stack g4">
        <h3 class="h3">시세 알림</h3>
        <label class="check"><input type="checkbox" checked><span><b>소나무</b> 시세가 5% 이상 변동하면 알려주세요</span></label>
        <label class="check"><input type="checkbox" checked><span><b>반송</b> 시세가 5% 이상 변동하면 알려주세요</span></label>
        <label class="check"><input type="checkbox"><span>매주 월요일 전체 수종 시세표를 보내주세요</span></label>
      </div>
      <div class="card card-pad stack g4">
        <h3 class="h3">거래 알림</h3>
        <label class="check"><input type="checkbox" checked><span>내 매물에 문의가 오면 문자로 알려주세요</span></label>
        <label class="check"><input type="checkbox" checked><span>가격 제안이 오면 알려주세요</span></label>
        <label class="check"><input type="checkbox" checked><span><b>시세 대비 20% 이상 낮은 제안은 받지 않겠습니다</b></span></label>
        <label class="check"><input type="checkbox"><span>정산 입금 시 알려주세요</span></label>
      </div>
      <div class="card card-pad stack g4">
        <h3 class="h3">받을 방법</h3>
        <label class="check"><input type="checkbox" checked><span>문자메시지 (010-****-1234)</span></label>
        <label class="check"><input type="checkbox" checked><span>카카오톡 알림톡</span></label>
        <label class="check"><input type="checkbox"><span>이메일</span></label>
        <p class="hint">광고성 정보는 보내지 않습니다. 거래와 시세에 관한 알림만 발송합니다.</p>
      </div>
      <button class="btn btn-primary btn-lg" type="button" onclick="alert('프로토타입입니다.\\n설정이 저장됩니다.')">설정 저장</button>
    </section>`,
};

function show(key) {
  document.getElementById('myPanel').innerHTML = PANELS[key]();
  document.querySelectorAll('#myNav button').forEach(b =>
    b.setAttribute('aria-current', String(b.dataset.p === key)));
}
document.getElementById('myNav').addEventListener('click', e => {
  const b = e.target.closest('[data-p]'); if (b) show(b.dataset.p);
});

/* 프로필 · 요약 숫자 반영 */
const me = Store.Me.get();
document.getElementById('meName').textContent = me.name;
document.getElementById('meInit').textContent = me.init;
document.getElementById('statListings').textContent = mine.length;
document.getElementById('statListingsSub').textContent =
  `직접 등록 ${Store.Listings.mine().length}건 포함`;

show(new URLSearchParams(location.search).get('tab') || 'dash');
</script>
</body>
</html>
