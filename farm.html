<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>농원 지도 · 법원리농원</title>
<meta name="description" content="법원리농원 지도. 구역을 누르고 나무를 누르면 그 나무를 볼 수 있어요.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .farm-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .farm-stats > div { padding: 16px; border-radius: 16px; background: var(--bg-soft); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .farm-stats span { font-size: 13px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
  .farm-stats b { font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  @media (max-width: 760px) { .farm-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; } .farm-stats b { font-size: 18px; } }
  .visit { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px 40px; flex-wrap: wrap;
    padding: clamp(24px, 4vw, 40px); background: var(--bg-soft); border-radius: 20px; }
  .visit .h2 { margin-top: 2px; }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="현재 위치">
      <a href="index.html">홈</a><span aria-hidden="true">›</span><span>농원 지도</span>
    </nav>

    <!-- 농장 헤더 -->
    <header class="page-head">
      <span class="eyebrow" id="farmMeta"></span>
      <h1 class="h1" id="farmName"></h1>
      <p class="lead" id="farmStory"></p>
      <div class="farm-stats mt5" id="farmStats"></div>
    </header>

    <!-- ============ 항공뷰 배치도 ============ -->
    <section id="map" class="mb6">
      <div class="section-head">
        <div>

          <h2 class="h2">농원 지도</h2>
          <p class="lead mt1">구역을 누르면 크게 보여요. 점 하나가 나무 한 그루예요.</p>
        </div>
        <div class="row g2">
          <button class="btn btn-secondary btn-sm" type="button" id="btnAll" hidden>← 전체 농장</button>
        </div>
      </div>

      <div class="farm-layout">
        <div class="aerial-wrap">
          <div class="aerial" id="aerial" role="group" aria-label="법원리농원 지도"></div>
          <div class="aerial-crumb" id="aerialCrumb" aria-live="polite"></div>
          <div class="aerial-tip" id="aerialTip" hidden></div>
          <div class="aerial-legend">
            <span><i class="lg lg-tree"></i>소나무</span>
            <span><i class="lg lg-bansong"></i>반송</span>
            <span><i class="lg lg-multi"></i>여러 줄기</span>
            <span><i class="lg lg-gone"></i>빈 자리</span>
            <span class="muted">점이 클수록 굵은 나무</span>
          </div>
        </div>
        <aside class="zone-panel card card-pad" id="zonePanel" aria-live="polite"></aside>
      </div>
      <p class="small muted mt3">손으로 그린 농원 지도를 옮긴 거라 실제 거리·방향과 조금 다를 수 있어요.</p>
    </section>

    <!-- 오시는 길 -->
    <section class="section-sm">
      <div class="visit">
        <div>
          <h2 class="h2">직접 와서 봐도 돼요</h2>
          <p class="muted mt2" id="farmAddr"></p>
          <p class="muted mt1">미리 연락 주시면 고른 나무 앞으로 안내해 드려요.</p>
        </div>
        <div class="row g3 wrapf">
          <a class="btn btn-primary btn-lg" href="inquiry.html">방문 문의하기</a>
          <a class="btn btn-secondary btn-lg" href="listings.html">나무 고르기</a>
        </div>
      </div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<!-- 개체 상세 팝업 (모바일) -->
<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" id="modalClose" aria-label="닫기">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/farm-data.js"></script>
<script src="assets/js/farm-map.js"></script>
<script src="assets/js/farm-photos.js"></script>
<script src="assets/js/app.js"></script>
<script>
/* ---------- 농장 정보 ---------- */
const ST = registryStats();
document.getElementById('farmName').textContent = FARM.name;
document.getElementById('farmMeta').textContent = `${FARM.addr}`;
document.getElementById('farmStory').textContent = `${FARM.years}년째 소나무만 키우는 농원이에요. 나무마다 번호표를 달고 굵기를 재 뒀어요.`;
document.getElementById('farmAddr').textContent = FARM.addr;
document.getElementById('farmStats').innerHTML = [
  ['넓이', FARM.area], ['소나무', `${ST.count}그루`], ['밑동 굵기', `${ST.rMin}~${ST.rMax}cm`], ['구역', '4구역'],
].map(([k, v]) => `<div><span>${k}</span><b class="num">${v}</b></div>`).join('');

/* ---------- 상태 ---------- */
const NS = 'http://www.w3.org/2000/svg';
const W = FARM_MAP.canvas.w, H = FARM_MAP.canvas.h;
const OVERVIEW = [0, 0, W, H];
let curZone = null;    /* 'A' | 'B' | 'C' | 'D' | null */
let curCode = null;
let curView = OVERVIEW.slice();
let animId = 0;
const treeEls = new Map();   /* code → <g> */

const zoneOf = id => FARM_MAP.zones[id];
/* A 구역 화면에는 A-H 열을 함께 포함 */
const partsOf = id => id === 'A' ? ['A', 'H'] : [id];
const treesOfZone = id => registryZone(id);   /* A-H는 zone 'A' */

function bbox(points, pad = 18) {
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  const x1 = Math.max(...xs) + pad, y1 = Math.max(...ys) + pad;
  /* 캔버스 비율(W:H) 유지 */
  let w = x1 - x0, h = y1 - y0;
  const ratio = W / H;
  if (w / h > ratio) h = w / ratio; else w = h * ratio;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return [cx - w / 2, cy - h / 2, w, h];
}
const zoneView = id => bbox(partsOf(id).flatMap(p => zoneOf(p).poly));

/* ---------- SVG 구성 ---------- */
const svg = document.createElementNS(NS, 'svg');
svg.setAttribute('viewBox', OVERVIEW.join(' '));
svg.setAttribute('aria-hidden', 'true');
svg.innerHTML = `
<defs>
  <filter id="fForest" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="4" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .18  0 0 0 0 .34  0 0 0 0 .21  0 0 0 .55 .45"/>
    <feBlend in2="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="fSoil" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".12" numOctaves="3" seed="11" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope=".22"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="a" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="fShadow" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx=".6" dy="1.1" stdDeviation=".7" flood-color="#0d2a17" flood-opacity=".45"/>
  </filter>
  <radialGradient id="gCanopy" cx="38%" cy="34%" r="70%">
    <stop offset="0" stop-color="#7FC16F"/><stop offset=".55" stop-color="#3E8A45"/><stop offset="1" stop-color="#1F5A2C"/>
  </radialGradient>
  <radialGradient id="gBansong" cx="38%" cy="34%" r="70%">
    <stop offset="0" stop-color="#C6E39A"/><stop offset=".6" stop-color="#7DB35A"/><stop offset="1" stop-color="#3F7433"/>
  </radialGradient>
</defs>
<rect id="bgForest" width="${W}" height="${H}" fill="#3F7A45" filter="url(#fForest)"/>
<g id="gPaths"></g>
<g id="gZones"></g>
<g id="gTrees"></g>
<g id="gLabels"></g>
<g id="gZoneLabels"></g>`;
document.getElementById('aerial').appendChild(svg);

const gPaths = svg.querySelector('#gPaths'), gZones = svg.querySelector('#gZones'),
      gTrees = svg.querySelector('#gTrees'), gLabels = svg.querySelector('#gLabels'),
      gZL = svg.querySelector('#gZoneLabels');

/* 길 */
FARM_MAP.paths.forEach(p => {
  const e = document.createElementNS(NS, 'path');
  e.setAttribute('d', p.d); e.setAttribute('class', 'ae-path'); e.setAttribute('stroke-width', p.w);
  gPaths.appendChild(e);
});

/* 구역 폴리곤 */
for (const id of Object.keys(FARM_MAP.zones)) {
  const Z = zoneOf(id);
  const poly = document.createElementNS(NS, 'polygon');
  poly.setAttribute('points', Z.poly.map(p => p.join(',')).join(' '));
  poly.setAttribute('class', 'ae-zone');
  poly.setAttribute('filter', 'url(#fSoil)');
  poly.dataset.zone = Z.parent || id;
  poly.addEventListener('click', () => selectZone(poly.dataset.zone));
  gZones.appendChild(poly);
}

/* 나무·결주 */
const rScale = r => 2.6 + (r - 14) * 0.14;      /* R14 → 2.6, R40 → 6.2 */
for (const id of Object.keys(FARM_SLOTS)) {
  for (const s of FARM_SLOTS[id]) {
    if (s.state === 'empty') continue;
    const zone = zoneOf(id).parent || id;
    if (s.state === 'gone') {
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('class', 'ae-gone'); g.dataset.zone = zone;
      g.innerHTML = `<circle cx="${s.x}" cy="${s.y}" r="2.6"/><path d="M${s.x - 1.6} ${s.y - 1.6}l3.2 3.2M${s.x + 1.6} ${s.y - 1.6}l-3.2 3.2"/>`;
      g.addEventListener('click', () => selectZone(zone));
      gTrees.appendChild(g);
      continue;
    }
    const T = registryByCode(s.code);
    if (!T) continue;
    const rr = rScale(T.r || 20);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'ae-tree' + (T.note === '반송' ? ' is-bansong' : ''));
    g.dataset.code = s.code; g.dataset.zone = zone;
    g.innerHTML = `
      <circle class="ae-hit" cx="${s.x}" cy="${s.y}" r="${Math.max(rr + 2.5, 6)}"/>
      <circle class="ae-canopy" cx="${s.x}" cy="${s.y}" r="${rr}" filter="url(#fShadow)"/>
      ${T.multi ? `<circle class="ae-multi" cx="${s.x}" cy="${s.y}" r="${(rr * 0.42).toFixed(2)}"/>` : ''}
      <text class="ae-seq" x="${s.x}" y="${s.y + rr + 3.6}" text-anchor="middle">${T.seq}</text>
      <title>${s.code} · R${T.r}${T.note ? ' · ' + T.note : ''}</title>`;
    g.addEventListener('click', e => {
      e.stopPropagation();
      if (curZone !== zone) { selectZone(zone, s.code); return; }
      selectTree(s.code);
    });
    g.addEventListener('pointerenter', e => showTip(e, T));
    g.addEventListener('pointermove', moveTip);
    g.addEventListener('pointerleave', hideTip);
    gTrees.appendChild(g);
    treeEls.set(s.code, g);
  }
}

/* 줄(line) 번호 라벨 — 확대 시에만 표시 */
for (const id of Object.keys(FARM_MAP.zones)) {
  const Z = zoneOf(id);
  if (id === 'H') {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'ae-line'); t.dataset.zone = 'A';
    t.setAttribute('x', Z.frame.origin[0] - 7); t.setAttribute('y', Z.frame.origin[1] + 1.6);
    t.setAttribute('text-anchor', 'end'); t.textContent = 'H';
    gLabels.appendChild(t); continue;
  }
  const off = id === 'A' ? -0.9 : -1;
  for (const line of Object.keys(Z.rows)) {
    const li = +line - 1;
    const x = Z.frame.origin[0] + li * Z.frame.u[0] + off * Z.frame.v[0];
    const y = Z.frame.origin[1] + li * Z.frame.u[1] + off * Z.frame.v[1];
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', 'ae-line'); t.dataset.zone = id;
    t.setAttribute('x', x); t.setAttribute('y', y + 1.6);
    t.setAttribute('text-anchor', 'middle'); t.textContent = line;
    gLabels.appendChild(t);
  }
}

/* 구역 라벨(전체 보기) */
for (const id of FARM_ZONE_ORDER) {
  const Z = zoneOf(id), n = treesOfZone(id).length;
  const [x, y] = Z.labelAt;
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'ae-zl'); g.dataset.zone = id;
  g.innerHTML = `<rect x="${x - 42}" y="${y - 14}" width="84" height="28" rx="14"/>
    <text x="${x}" y="${y + 1}" text-anchor="middle" dominant-baseline="middle"><tspan class="z">${id}</tspan><tspan class="n" dx="6">${n}그루</tspan></text>`;
  g.addEventListener('click', () => selectZone(id));
  gZL.appendChild(g);
}

/* ---------- viewBox 애니메이션 ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function flyTo(target) {
  cancelAnimationFrame(animId);
  if (reduceMotion) { curView = target.slice(); svg.setAttribute('viewBox', curView.join(' ')); return; }
  const from = curView.slice(), t0 = performance.now(), dur = 620;
  const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const k = ease(Math.min(1, (now - t0) / dur));
    curView = from.map((v, i) => v + (target[i] - v) * k);
    svg.setAttribute('viewBox', curView.map(v => v.toFixed(2)).join(' '));
    if (k < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}

/* ---------- 선택 ---------- */
const aerialEl = document.getElementById('aerial');
function selectZone(id, thenCode) {
  curZone = id; curCode = null;
  aerialEl.classList.toggle('is-zoomed', !!id);
  svg.querySelectorAll('[data-zone]').forEach(el => el.classList.toggle('is-on', !!id && el.dataset.zone === id));
  svg.querySelectorAll('.ae-tree.is-sel').forEach(el => el.classList.remove('is-sel'));
  document.getElementById('btnAll').hidden = !id;
  flyTo(id ? zoneView(id) : OVERVIEW);
  renderCrumb();
  if (thenCode) selectTree(thenCode);
  else { renderPanel(); history.replaceState(null, '', id ? '#' + id : location.pathname); }
}
function selectTree(code) {
  const T = registryByCode(code); if (!T) return;
  if (curZone !== T.zone) { selectZone(T.zone, code); return; }
  curCode = T.code;
  svg.querySelectorAll('.ae-tree.is-sel').forEach(el => el.classList.remove('is-sel'));
  treeEls.get(T.code)?.classList.add('is-sel');
  history.replaceState(null, '', '#' + T.code);
  renderCrumb();
  renderPanel();
  if (matchMedia('(max-width: 900px)').matches) openModal(T.code);
}
document.getElementById('btnAll').addEventListener('click', () => selectZone(null));

function renderCrumb() {
  const c = document.getElementById('aerialCrumb');
  const parts = [`<button type="button" data-go="all">법원리농원 전체</button>`];
  if (curZone) parts.push(`<button type="button" data-go="zone">${zoneOf(curZone).name}</button>`);
  if (curCode) parts.push(`<b>${curCode}</b>`);
  c.innerHTML = parts.join('<span aria-hidden="true">›</span>');
  c.querySelectorAll('button').forEach(b => b.addEventListener('click', () => b.dataset.go === 'all' ? selectZone(null) : selectZone(curZone)));
}

/* ---------- 툴팁 ---------- */
const tip = document.getElementById('aerialTip');
function showTip(e, T) {
  tip.innerHTML = `<b class="tree-code">${T.code}</b> ${(sizeOf(T.r) || {}).label || ''} 나무 · 밑동 ${T.r}cm · ${treeForm(T)}`;
  tip.hidden = false; moveTip(e);
}
function moveTip(e) {
  const r = aerialEl.parentElement.getBoundingClientRect();
  tip.style.left = (e.clientX - r.left + 14) + 'px';
  tip.style.top = (e.clientY - r.top - 10) + 'px';
}
function hideTip() { tip.hidden = true; }

/* ---------- 우측 패널 ---------- */
const panel = document.getElementById('zonePanel');
function renderPanel() {
  if (!curZone) return renderPanelOverview();
  if (!curCode) return renderPanelZone(curZone);
  panel.innerHTML = treeDetailHTML(curCode, true);
  bindDetail(panel);
}

function zoneStatLine(id) {
  const s = registryStats(treesOfZone(id));
  return `R${s.rMin}–${s.rMax} · 평균 R${s.rAvg}${s.multi ? ` · 다간 ${s.multi}` : ''}${s.bansong ? ` · 반송 ${s.bansong}` : ''}`;
}

function renderPanelOverview() {
  panel.innerHTML = `
    <h3 class="h3">소나무 ${ST.count}그루</h3>
    <p class="small muted mt1">구역을 골라 보세요</p>
    <div class="zone-list mt4">
      ${FARM_ZONE_ORDER.map(id => {
        const Z = zoneOf(id), n = treesOfZone(id).length;
        return `<button type="button" class="zone-item" data-zone="${id}">
          <span class="zone-item-id">${id}</span>
          <span class="grow">
            <span class="zone-item-name">${Z.name} <span class="muted">· ${Z.sub}</span></span>
            <span class="zone-item-meta">${n}그루</span>
          </span>
          <span class="zone-item-arrow" aria-hidden="true">›</span>
        </button>`;
      }).join('')}
    </div>
    <div class="divider mt4"></div>
    <p class="small muted mt3">나무에 달린 번호표로 바로 찾을 수 있어요</p>
    <form class="row g2 mt2" id="codeJump">
      <input class="input" style="flex:1" placeholder="예: A-H-1" aria-label="번호표">
      <button class="btn btn-secondary" type="submit">이동</button>
    </form>`;
  panel.querySelectorAll('.zone-item').forEach(b => b.addEventListener('click', () => selectZone(b.dataset.zone)));
  panel.querySelector('#codeJump').addEventListener('submit', e => {
    e.preventDefault();
    const T = registryByCode(e.target.querySelector('input').value);
    if (T) selectTree(T.code); else toast('그 번호의 나무가 없어요');
  });
}

function renderPanelZone(id) {
  const Z = zoneOf(id), trees = treesOfZone(id);
  /* 줄별 묶기 (H는 마지막) */
  const byLine = new Map();
  trees.forEach(t => { if (!byLine.has(t.line)) byLine.set(t.line, []); byLine.get(t.line).push(t); });
  const lines = [...byLine.keys()].sort((a, b) => ((a === 'H') - (b === 'H')) || ((+a) - (+b)));
  panel.innerHTML = `
    <button class="btn-link small" type="button" id="backAll">← 전체 농장</button>
    <div class="row g2 wrapf mt2">
      <h3 class="h3">${Z.name}</h3>
      <span class="badge badge-green">${trees.length}그루</span>
    </div>
    <p class="small muted mt1">${Z.sub}</p>
    <p class="small muted mt1">줄 = ${Z.lineAxis} · 번호 = ${Z.posAxis}${Z.axisNote ? `<br><span class="warn">${Z.axisNote}</span>` : ''}</p>
    <p class="small muted mt3">지도 위의 나무를 누르거나 아래 번호를 누르세요.</p>
    <div class="line-list mt2">
      ${lines.map(line => `
        <div class="line-row">
          <span class="line-k">${line === 'H' ? 'H열' : (id === 'A' ? line + '열' : line + '줄')}</span>
          <span class="line-chips">${byLine.get(line).map(t => `<button type="button" class="chip-code${t.note === '반송' ? ' is-bansong' : ''}" data-code="${t.code}" title="${t.code} · R${t.r}">${t.seq}</button>`).join('')}</span>
        </div>`).join('')}
    </div>`;
  panel.querySelector('#backAll').addEventListener('click', () => selectZone(null));
  panel.querySelectorAll('.chip-code').forEach(b => {
    b.addEventListener('click', () => selectTree(b.dataset.code));
    b.addEventListener('pointerenter', () => treeEls.get(b.dataset.code)?.classList.add('is-hover'));
    b.addEventListener('pointerleave', () => treeEls.get(b.dataset.code)?.classList.remove('is-hover'));
  });
}

/* ---------- 같은 구역 안에서 앞뒤 나무로 이동 (배치도 순서) ---------- */
function zoneOrder(zoneId) {
  const ids = Object.keys(FARM_MAP.zones).filter(id => id === zoneId || zoneOf(id).parent === zoneId);
  return ids.flatMap(id => FARM_SLOTS[id]).filter(s => s.state === 'tree').map(s => s.code);
}
function neighborsOf(code) {
  const T = registryByCode(code), list = zoneOrder(T.zone), idx = list.indexOf(T.code);
  return { idx, total: list.length, prev: list[idx - 1] || null, next: list[idx + 1] || null };
}
function stepTree(dir) {
  if (!curCode) return;
  const nb = neighborsOf(curCode);
  const to = dir < 0 ? nb.prev : nb.next;
  if (to) selectTree(to);
}
document.addEventListener('keydown', e => {
  if (!curCode || e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepTree(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); stepTree(1); }
});
/* 더블클릭: 지도 어디든 그 지점으로 이동 (구역 → 확대, 나무 → 선택, 숲 → 전체) */
svg.addEventListener('dblclick', e => {
  e.preventDefault();
  const tree = e.target.closest('.ae-tree');
  if (tree) { selectTree(tree.dataset.code); return; }
  const z = e.target.closest('[data-zone]');
  if (z) { selectZone(z.dataset.zone); return; }
  selectZone(null);
});

/* ---------- 개체 상세 ---------- */
function treeDetailHTML(code, inPanel) {
  const T = registryByCode(code), hero = heroOf(T.code), photos = treePhotosOf(T.code), tags = photosOf(T.code).filter(p => p.kind === 'tag');
  const stems = T.stems ? T.stems.join(' + ') : null;
  return `
    ${inPanel ? `<button class="btn-link small" type="button" data-act="back">← ${zoneOf(T.zone).name}</button>` : ''}
    <div class="modal-photo mt2">
      <img src="${hero.src}" alt="${T.code} ${hero.sample ? '참고 사진' : '실사진'}" loading="lazy">
      <span class="photo-tag">${heroLabel(hero)}</span>
    </div>
    ${photos.length > 1 || tags.length ? `<div class="thumbs">${[...photos, ...tags].map(p => `<img src="${p.file}" alt="${p.kind === 'tag' ? '관리표' : '사진'}" data-src="${p.file}" loading="lazy">`).join('')}</div>` : ''}
    <div class="row g2 wrapf mt3">
      <span class="badge badge-green">${(sizeOf(T.r) || {}).label || ''} 나무</span>
      <span class="badge badge-gray">${treeForm(T)}</span>
    </div>
    <h3 class="h3 mt2" id="modalTitle"><span class="tree-code" style="font-size:19px">${T.code}</span></h3>
    <p class="small muted mt1">${farmPlaceText(T.code)}</p>
    ${(() => { const nb = neighborsOf(T.code); return `
    <div class="tree-nav mt2">
      <button class="btn btn-ghost btn-sm" type="button" data-act="prev" ${nb.prev ? '' : 'disabled'}>← ${nb.prev ? nb.prev : '이전'}</button>
      <span class="small muted">${nb.idx + 1} / ${nb.total} · ${zoneOf(T.zone).name}</span>
      <button class="btn btn-ghost btn-sm" type="button" data-act="next" ${nb.next ? '' : 'disabled'}>${nb.next ? nb.next : '다음'} →</button>
    </div>`; })()}
    <div class="modal-specs">
      <div class="cell"><div class="k">밑동 굵기</div><div class="v num">${T.r != null ? T.r + 'cm' : '—'}</div></div>
      <div class="cell"><div class="k">모양</div><div class="v">${treeForm(T)}</div></div>
    </div>
    <div class="row g2 mt4">
      <a class="btn btn-secondary" style="flex:1" href="tree.html?code=${T.code}">자세히 보기</a>
      <a class="btn btn-primary" style="flex:1" href="inquiry.html?code=${T.code}">가격 물어보기</a>
    </div>`;
}
function bindDetail(root) {
  root.querySelector('[data-act="back"]')?.addEventListener('click', () => selectZone(curZone));
  root.querySelectorAll('.thumbs img').forEach(im => im.addEventListener('click', () => {
    const main = root.querySelector('.modal-photo img'); main.src = im.dataset.src;
  }));
  root.querySelector('[data-act="prev"]')?.addEventListener('click', () => stepTree(-1));
  root.querySelector('[data-act="next"]')?.addEventListener('click', () => stepTree(1));
}

/* ---------- 모달(모바일 상세) ---------- */
const back = document.getElementById('modalBack');
let lastFocus = null;
function openModal(code) {
  lastFocus = document.activeElement;
  document.getElementById('modalBody').innerHTML = treeDetailHTML(code, false);
  bindDetail(document.getElementById('modalBody'));
  back.hidden = false; document.body.style.overflow = 'hidden';
  document.getElementById('modalClose').focus();
}
function closeModal() {
  back.hidden = true; document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
document.getElementById('modalClose').addEventListener('click', closeModal);
back.addEventListener('click', e => { if (e.target === back) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !back.hidden) closeModal(); });

/* 숲(배경) 클릭 → 확대 중이면 전체로 */
svg.querySelector('#bgForest').addEventListener('click', () => { if (curZone) selectZone(null); });

/* ---------- 시작 (해시 딥링크) ---------- */
(function boot() {
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (/^[A-D]$/.test(h)) { curView = zoneView(h); selectZone(h); return; }
  const T = h ? registryByCode(h) : null;
  if (T) { curView = zoneView(T.zone); selectZone(T.zone, T.code); return; }
  selectZone(null);
})();
window.addEventListener('hashchange', () => {
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  if (/^[A-D]$/.test(h)) { if (curZone !== h || curCode) selectZone(h); }
  else if (registryByCode(h)) { if (curCode !== registryByCode(h).code) selectTree(h); }
  else if (!h && curZone) selectZone(null);
});
</script>
</body>
</html>
